// 1. KEAMANAN, HASH KATA SANDI, SANITASI & EFEK SUARA
// ----------------------------------------------------------------------------
const Security = {
  sanitize(str) {
    if (typeof str !== 'string') return '';
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#x27;' };
    return str.replace(/[&<>"']/g, m => map[m]);
  },
  // Hash deterministik sederhana dengan salt agar kata sandi tidak disimpan plaintext
  hashPassword(plain) {
    const salted = 'PQ_SALT_2026::' + String(plain || '');
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < salted.length; i++) {
      const ch = salted.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return 'sha256_sim_' + (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
  },
  verifyPassword(plain, hashed) {
    return this.hashPassword(plain) === hashed;
  }
};

function fmtFrac(num, den) {
  return `<span class="frac"><span>${num}</span><span>${den}</span></span>`;
}

const SoundFX = {
  synth: null,
  init() {
    if (!this.synth && typeof Tone !== 'undefined') {
      try {
        this.synth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: 'triangle' },
          envelope: { attack: 0.01, decay: 0.14, sustain: 0.05, release: 0.25 }
        }).toDestination();
        this.synth.volume.value = -10;
      } catch (e) {}
    }
  },
  play(type) {
    if (!AppState.settings.soundEnabled || typeof Tone === 'undefined') return;
    try {
      if (Tone.context && Tone.context.state !== 'running') Tone.start();
      this.init();
      if (!this.synth) return;
      const now = Tone.now();
      if (type === 'click') this.synth.triggerAttackRelease('C5', '32n', now);
      else if (type === 'correct') {
        this.synth.triggerAttackRelease('E5', '16n', now);
        this.synth.triggerAttackRelease('G5', '16n', now + 0.08);
        this.synth.triggerAttackRelease('C6', '8n', now + 0.16);
      } else if (type === 'wrong') {
        this.synth.triggerAttackRelease('E3', '16n', now);
        this.synth.triggerAttackRelease('Eb3', '8n', now + 0.12);
      } else if (type === 'levelup') {
        ['C5', 'E5', 'G5', 'B5', 'C6'].forEach((note, idx) => {
          this.synth.triggerAttackRelease(note, '16n', now + idx * 0.08);
        });
      }
    } catch (e) {}
  }
};

// ----------------------------------------------------------------------------
// 4. GUARD KEAMANAN & PERHITUNGAN AKADEMIK AKURAT
// ----------------------------------------------------------------------------
function isTeacherAuthorized() {
  return AppState.authSession.role === 'teacher' && AppState.authSession.userId === AppState.teacherAccount.id;
}

function getLoggedInStudent() {
  if (AppState.authSession.role !== 'student') return null;
  return AppState.studentsList.find(s => s.id === AppState.authSession.userId) || null;
}

function getPublishedSubmaterials() {
  return AppState.chapters.flatMap(c => c.submaterials.filter(s => s.status === 'published'));
}

function getAllSubmaterials() {
  return AppState.chapters.flatMap(c => c.submaterials);
}

// Rumus Progres: (Jumlah submateri tuntas / Jumlah seluruh submateri wajib) * 100%
function getProgressPercent(stu) {
  const wajib = getPublishedSubmaterials();
  if (!wajib.length || !stu) return 0;
  const done = wajib.filter(s => stu.submaterialProgress && stu.submaterialProgress[s.id]?.completed).length;
  return Math.round((done / wajib.length) * 100);
}

function getEffectivePracticeScore(progEntry) {
  if (!progEntry || !progEntry.attempts) return null;
  const pol = AppState.settings.scoreDisplayPolicy;
  if (pol === 'latest') return progEntry.latestScore ?? progEntry.bestScore;
  if (pol === 'first') return progEntry.firstScore ?? progEntry.bestScore;
  return progEntry.bestScore;
}

// Rumus Rata-rata Nilai Latihan: Jumlah nilai yang diperhitungkan / Jumlah penilaian
function getAveragePracticeScore(stu) {
  if (!stu || !stu.submaterialProgress) return 0;
  const scores = Object.values(stu.submaterialProgress)
    .map(p => getEffectivePracticeScore(p))
    .filter(v => typeof v === 'number');
  if (!scores.length) return 0;
  return Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
}

function getLatestSummativeScore(stu) {
  if (!stu || !Array.isArray(stu.summativeAttempts) || !stu.summativeAttempts.length) return null;
  return stu.summativeAttempts[stu.summativeAttempts.length - 1].score;
}

function getStudentLevelInfo(stu) {
  const pts = stu ? stu.points : 0;
  let current = LEVEL_RULES[0];
  let next = LEVEL_RULES[1] || null;
  for (let i = 0; i < LEVEL_RULES.length; i++) {
    if (pts >= LEVEL_RULES[i].minPoints) {
      current = LEVEL_RULES[i];
      next = LEVEL_RULES[i + 1] || null;
    }
  }
  const pct = next
    ? Math.min(100, Math.round(((pts - current.minPoints) / (next.minPoints - current.minPoints)) * 100))
    : 100;
  return { current, next, pct };
}

function awardUniquePoints(stu, eventKey, pts, label) {
  if (!stu) return false;
  if (!Array.isArray(stu.claimedPointEvents)) stu.claimedPointEvents = [];
  if (stu.claimedPointEvents.includes(eventKey)) return false;
  const prevLvl = getStudentLevelInfo(stu).current.level;
  stu.claimedPointEvents.push(eventKey);
  stu.points += pts;
  const newLvl = getStudentLevelInfo(stu).current.level;
  triggerPointPop(`+${pts} POIN! ${label}`);
  if (newLvl > prevLvl) {
    SoundFX.play('levelup');
    showToast(`Selamat! Naik ke Level ${newLvl}: ${getStudentLevelInfo(stu).current.name}!`, 'yellow');
  }
  return true;
}

function showToast(msg, tone = 'blue') {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const palette = {
    blue: 'bg-blue-600 text-white',
    green: 'bg-emerald-600 text-white',
    yellow: 'bg-amber-400 text-slate-950',
    red: 'bg-rose-600 text-white'
  };
  const el = document.createElement('div');
  el.className = `px-4 py-3 rounded-2xl shadow-xl font-extrabold text-xs flex items-center gap-2 pointer-events-auto transition-all duration-300 ${palette[tone] || palette.blue}`;
  el.innerHTML = `<i class="fa-solid fa-circle-info"></i><span>${Security.sanitize(msg)}</span>`;
  container.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    setTimeout(() => el.remove(), 300);
  }, 3200);
}

function triggerPointPop(text = '+10 POIN!') {
  if (AppState.settings.reducedMotion) return;
  const fx = document.getElementById('fx-layer');
  if (!fx) return;
  const pop = document.createElement('div');
  pop.className = 'animate-point-pop fixed top-1/3 left-1/2 px-5 py-2.5 rounded-full bg-amber-400 text-slate-950 font-black text-sm shadow-2xl border-2 border-white flex items-center gap-2';
  pop.innerHTML = `<i class="fa-solid fa-star text-yellow-700"></i><span>${Security.sanitize(text)}</span>`;
  fx.appendChild(pop);
  setTimeout(() => pop.remove(), 1450);
}

function openModal(html) {
  const box = document.getElementById('modal-container');
  const content = document.getElementById('modal-content');
  if (!box || !content) return;
  content.innerHTML = html;
  box.classList.remove('hidden');
  box.classList.add('flex');
}

function closeModal() {
  const box = document.getElementById('modal-container');
  if (!box) return;
  box.classList.add('hidden');
  box.classList.remove('flex');
}

function logAudit(action) {
  const now = new Date();
  const stamp = now.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) + ' ' +
    now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  AppState.auditLogs.unshift({
    time: stamp,
    actor: AppState.teacherAccount.name,
    action
  });
}

  if (idMatch && passMatch) {

function handleStudentLogin() {
  const classId = document.getElementById('s-login-class')?.value;
  const nameVal = document.getElementById('s-login-name')?.value.trim().toLowerCase();
  const userVal = document.getElementById('s-login-user')?.value.trim().toLowerCase();
  const passVal = document.getElementById('s-login-pass')?.value.trim();
  const errBox = document.getElementById('s-login-err');

  const found = AppState.studentsList.find(s =>
    s.classId === classId &&
    s.name.toLowerCase() === nameVal &&
    (s.username.toLowerCase() === userVal || s.nis.toLowerCase() === userVal) &&
    Security.verifyPassword(passVal, s.passwordHash)
  );

  if (found) {
    SoundFX.play('correct');
    AppState.authSession = {
      role: 'student',
      userId: found.id,
      token: 'STU_' + Date.now()
    };
    AppState.currentPage = 'student-dash';
    AppState.studentTab = 'dashboard';
    closeModal();
    showToast(`Halo, ${found.name}! Selamat belajar.`, 'green');
    render();
  } else {
    SoundFX.play('wrong');
    if (errBox) {
      errBox.textContent = 'Data kelas, nama, username/NIS, atau kata sandi tidak cocok.';
      errBox.classList.remove('hidden');
    }
  }
}

                  <span class="font-extrabold text-slate-800">${Security.sanitize(h.label)}</span>

                </div>
                <span class="font-black ${h.score >= AppState.settings.passingScore ? 'text-emerald-600' : 'text-rose-600'}">Nilai: ${h.score}</span>

            `).join('')}

}

function getSubmaterialStatusBadge(stu, sub, index, allPubSubs) {
  const prog = stu.submaterialProgress[sub.id];
  const prevSub = index > 0 ? allPubSubs[index - 1] : null;
  const prevDone = !prevSub || Boolean(stu.submaterialProgress[prevSub.id]?.completed);

  if (!prevDone && !prog) {
    return { code: 'locked', label: 'Terkunci', icon: 'fa-lock', cls: 'bg-slate-200 text-slate-600 border-slate-300' };
  }
  if (prog?.completed && prog.bestScore >= 90) {
    return { code: 'high', label: `Tuntas Nilai Tinggi (${prog.bestScore})`, icon: 'fa-crown', cls: 'bg-amber-100 text-amber-900 border-amber-400' };
  }
  if (prog?.completed) {
    return { code: 'done', label: `Sudah Selesai (${prog.bestScore})`, icon: 'fa-circle-check', cls: 'bg-emerald-100 text-emerald-900 border-emerald-400' };
  }
  if (prog && prog.attempts > 0) {
    return { code: 'inprogress', label: `Sedang Dipelajari (${prog.latestScore})`, icon: 'fa-spinner', cls: 'bg-blue-100 text-blue-900 border-blue-400' };
  }
  return { code: 'open', label: 'Belum Dimulai', icon: 'fa-play', cls: 'bg-purple-100 text-purple-900 border-purple-300' };
}

function openSubmaterial(chapId, subId) {
  const stu = getLoggedInStudent();
  const allPub = getPublishedSubmaterials();
  const idx = allPub.findIndex(s => s.id === subId);
  if (idx > 0) {
    const prev = allPub[idx - 1];
    if (!stu.submaterialProgress[prev.id]?.completed) {
      SoundFX.play('wrong');
      showToast(`Selesaikan "${prev.title}" terlebih dahulu untuk membuka materi ini!`, 'yellow');
      return;
    }
  }
  SoundFX.play('click');
  AppState.activeChapterId = chapId;
  AppState.activeSubmaterialId = subId;
  AppState.studentTab = 'lesson';
  AppState.lessonStep = 'learn';
  render();
}

  if (!stu.completedActivities.includes(subId)) {
    stu.completedActivities.push(subId);

  const awarded = awardUniquePoints(stu, 'act-' + subId, 5, 'Aktivitas Interaktif!');

    SoundFX.play('correct');
    showToast('Aktivitas interaktif selesai! (+5 Poin)', 'green');
  } else {
    showToast('Aktivitas interaktif sudah tercatat selesai.', 'blue');
  }
  render();
}

function renderInteractiveLab(type) {
  const ls = AppState.labState;
  if (type === 'pizza-rational') {
    const n = ls.pizzaNum;
    const d = ls.pizzaDen;
    const gcd = (a, b) => (b === 0 ? a : gcd(b, a % b));
    const g = gcd(n, d);
    return `
      <div class="space-y-3 text-xs">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="font-extrabold text-slate-700">Objek Terpilih (a): ${n}</label>
            <input type="range" min="1" max="${d}" value="${n}" oninput="AppState.labState.pizzaNum=+this.value; render();" class="w-full" />
          </div>
          <div>
            <label class="font-extrabold text-slate-700">Total Objek (b): ${d}</label>
            <input type="range" min="2" max="12" value="${d}" oninput="AppState.labState.pizzaDen=+this.value; if(AppState.labState.pizzaNum>AppState.labState.pizzaDen) AppState.labState.pizzaNum=AppState.labState.pizzaDen; render();" class="w-full" />
          </div>
        </div>
        <div class="grid grid-cols-6 gap-1.5">
          ${Array.from({ length: d }).map((_, i) => `
            <div onclick="AppState.labState.pizzaNum=${i + 1}; render();" class="cursor-pointer h-9 rounded-lg flex items-center justify-center font-black ${i < n ? 'bg-amber-400 text-slate-950' : 'bg-white border border-slate-300 text-slate-400'}">
              ${i + 1}
            </div>
          `).join('')}
        </div>
        <div class="p-3 rounded-xl bg-white border border-slate-200 font-extrabold text-slate-800">
          Rasio Terpilih : Total = <span class="text-blue-700">${n}/${d}</span> • Bentuk Sederhana: <span class="text-emerald-700">${n / g}/${d / g}</span> • Desimal: <span class="text-purple-700">${(n / d).toFixed(3).replace('.', ',')}</span>
        </div>
      </div>
    `;
  }

  if (type === 'fraction-converter-lab') {
    const num = ls.convNum;
    const den = ls.convDen;
    const gcd = (a, b) => (b === 0 ? a : gcd(b, a % b));
    const g = gcd(num, den);
    const sNum = num / g;
    const sDen = den / g;
    const whole = Math.floor(sNum / sDen);
    const rem = sNum % sDen;
    const mixedStr = sDen === 1 ? `${whole}` : whole > 0 ? `${whole} ${rem}/${sDen}` : `${sNum}/${sDen} (Murni)`;
    const decVal = num / den;
    const decStr = Number.isInteger(decVal) ? `${decVal}` : decVal.toFixed(3).replace(/\.?0+$/, '').replace('.', ',');
    const pctStr = (decVal * 100).toFixed(1).replace(/\.0$/, '').replace('.', ',') + '%';
    const permilStr = Math.round(decVal * 1000) + '‰';

    return `
      <div class="space-y-3 text-xs">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="font-extrabold text-slate-700">Pembilang: ${num}</label>
            <input type="range" min="1" max="25" value="${num}" oninput="AppState.labState.convNum=+this.value; render();" class="w-full" />
          </div>
          <div>
            <label class="font-extrabold text-slate-700">Penyebut: ${den}</label>
            <input type="range" min="2" max="20" value="${den}" oninput="AppState.labState.convDen=+this.value; render();" class="w-full" />
          </div>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 text-center">
          <div class="p-2.5 rounded-xl bg-white border border-slate-200"><div class="text-[10px] text-slate-400 font-bold">Biasa</div><div class="font-black text-blue-700">${sNum}/${sDen}</div></div>
          <div class="p-2.5 rounded-xl bg-white border border-slate-200"><div class="text-[10px] text-slate-400 font-bold">Campuran</div><div class="font-black text-emerald-700">${mixedStr}</div></div>
          <div class="p-2.5 rounded-xl bg-white border border-slate-200"><div class="text-[10px] text-slate-400 font-bold">Desimal</div><div class="font-black text-amber-700">${decStr}</div></div>
          <div class="p-2.5 rounded-xl bg-white border border-slate-200"><div class="text-[10px] text-slate-400 font-bold">Persen</div><div class="font-black text-purple-700">${pctStr}</div></div>
          <div class="p-2.5 rounded-xl bg-white border border-slate-200"><div class="text-[10px] text-slate-400 font-bold">Permil</div><div class="font-black text-rose-700">${permilStr}</div></div>
        </div>
      </div>
    `;
  }

  if (type === 'venn-classifier') {
    const items = [
      { label: '0,333...', cat: 'Rasional' },
      { label: '√2', cat: 'Irasional' },
      { label: '-7/4', cat: 'Rasional' },
      { label: 'π', cat: 'Irasional' }
    ];
    return `
      <div class="space-y-2.5 text-xs">
        <p class="font-bold text-slate-700">Klik kategori yang tepat untuk setiap bilangan:</p>
        <div class="grid grid-cols-2 gap-2">
          ${items.map((it, idx) => {
            const chosen = ls.vennPlaced[idx];
            const ok = chosen === it.cat;
            return `
              <div class="p-2.5 rounded-xl bg-white border border-slate-200 flex items-center justify-between gap-2">
                <span class="font-black text-sm text-slate-900">${it.label}</span>
                <div class="flex gap-1">
                  <button onclick="AppState.labState.vennPlaced[${idx}]='Rasional'; render();" class="px-2 py-1 rounded text-[10px] font-black ${chosen === 'Rasional' ? (ok ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white') : 'bg-slate-100'}">Rasional</button>
                  <button onclick="AppState.labState.vennPlaced[${idx}]='Irasional'; render();" class="px-2 py-1 rounded text-[10px] font-black ${chosen === 'Irasional' ? (ok ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white') : 'bg-slate-100'}">Irasional</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }

  if (type === 'number-line-lab') {
    const a = ls.nlValA;
    const b = ls.nlValB;
    const cmp = a < b ? '<' : a > b ? '>' : '=';
    return `
      <div class="space-y-3 text-xs">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="font-extrabold text-blue-700">Titik A: ${a.toFixed(2).replace('.', ',')}</label>
            <input type="range" min="-1" max="1" step="0.05" value="${a}" oninput="AppState.labState.nlValA=+this.value; render();" class="w-full" />
          </div>
          <div>
            <label class="font-extrabold text-rose-700">Titik B: ${b.toFixed(2).replace('.', ',')}</label>
            <input type="range" min="-1" max="1" step="0.05" value="${b}" oninput="AppState.labState.nlValB=+this.value; render();" class="w-full" />
          </div>
        </div>
        <div class="relative h-10 bg-white rounded-xl border border-slate-300 flex items-center px-4">
          <div class="w-full h-1 bg-slate-300 relative">
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-0.5 h-4 bg-slate-900"></div>
            <div style="left:${(a + 1) * 50}%" class="absolute top-1/2 -translate-x-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-blue-600 border-2 border-white shadow"></div>
            <div style="left:${(b + 1) * 50}%" class="absolute top-1/2 -translate-x-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-rose-600 border-2 border-white shadow"></div>
          </div>
        </div>
        <div class="p-2.5 rounded-xl bg-white border border-slate-200 font-black text-center">
          Perbandingan: ${a.toFixed(2).replace('.', ',')} <span class="text-lg text-emerald-700 mx-1">${cmp}</span> ${b.toFixed(2).replace('.', ',')}
        </div>
      </div>
    `;
  }

  if (type === 'karina-kitchen') {
    return `
      <div class="p-3 rounded-xl bg-white border border-slate-200 text-xs space-y-1.5">
        <div class="font-extrabold text-slate-900">Takaran Tepung 3 Kue Tradisional:</div>
        <div>• Kue Nagasari (1¾) + Kue Talam (2⅓) + Kue Surabi (½)</div>
        <div class="font-black text-emerald-700">= (1 + 2) + (9/12 + 4/12 + 6/12) = 3 + 19/12 = 4 7/12 cangkir</div>
      </div>
    `;
  }

  if (type === 'decimal-hanger') {
    const total = +(ls.hangerW1 + ls.hangerW2).toFixed(2);
    const rem = +(4.5 - total).toFixed(2);
    return `
      <div class="space-y-2.5 text-xs">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="font-extrabold">Beban 1: ${ls.hangerW1.toFixed(2).replace('.', ',')} kg</label>
            <input type="range" min="0.5" max="3" step="0.05" value="${ls.hangerW1}" oninput="AppState.labState.hangerW1=+this.value; render();" class="w-full" />
          </div>
          <div>
            <label class="font-extrabold">Beban 2: ${ls.hangerW2.toFixed(2).replace('.', ',')} kg</label>
            <input type="range" min="0.5" max="2.5" step="0.05" value="${ls.hangerW2}" oninput="AppState.labState.hangerW2=+this.value; render();" class="w-full" />
          </div>
        </div>
        <div class="p-2.5 rounded-xl ${rem >= 0 ? 'bg-emerald-100 text-emerald-950' : 'bg-rose-100 text-rose-950'} font-black">
          Total Beban: ${total.toFixed(2).replace('.', ',')} kg dari Maks 4,50 kg → ${rem >= 0 ? `Sisa kapasitas ${rem.toFixed(2).replace('.', ',')} kg (Aman)` : `Melebihi batas ${Math.abs(rem).toFixed(2).replace('.', ',')} kg!`}
        </div>
      </div>
    `;
  }

  if (type === 'fraction-grid-lab') {
    const { gridA, gridB, gridC, gridD } = ls;
    return `
      <div class="p-3 rounded-xl bg-white border border-slate-200 text-xs space-y-2">
        <div class="font-extrabold text-slate-800">Model Luas: ${gridA}/${gridB} × ${gridC}/${gridD} = <span class="text-blue-700">${gridA * gridC}/${gridB * gridD}</span></div>
        <div class="grid gap-1" style="grid-template-columns: repeat(${gridD}, minmax(0, 1fr));">
          ${Array.from({ length: gridB * gridD }).map((_, idx) => {
            const r = Math.floor(idx / gridD);
            const c = idx % gridD;
            const active = r < gridA && c < gridC;
            return `<div class="h-6 rounded ${active ? 'bg-blue-600' : 'bg-slate-200'}"></div>`;
          }).join('')}
        </div>
      </div>
    `;
  }

  return `
    <div class="p-3 rounded-xl bg-white border border-slate-200 text-xs space-y-2">
      <div class="font-extrabold text-slate-900">Tantangan Tanda Koma: Berapa hasil 0,4 × 0,05?</div>
      <div class="flex flex-wrap gap-2">
        ${['0,2', '0,02', '0,002'].map(opt => `
          <button onclick="AppState.labState.commaChoice='${opt}'; render();"

            ${opt}
          </button>
        `).join('')}
      </div>
      ${ls.commaChoice ? `<div class="font-bold ${ls.commaChoice === '0,02' ? 'text-emerald-700' : 'text-rose-700'}">${ls.commaChoice === '0,02' ? 'Tepat! 4 × 5 = 20 dengan 3 angka belakang koma → 0,02.' : 'Belum tepat! Hitung total digit di belakang koma (1 + 2 = 3 digit).'}</div>` : ''}
    </div>
  `;
}

function buildConstructiveTenQuestions(subId) {
  const direct = AppState.questions.filter(q => q.submaterialId === subId);
  const pool = AppState.questions.filter(q => q.submaterialId !== subId);
  const combined = [...direct];
  let idx = 0;
  while (combined.length < 10 && idx < pool.length) {
    combined.push(pool[idx]);
    idx++;
  }
  return combined.slice(0, 10);
}

function startPracticeQuiz(subId) {
  const stu = getLoggedInStudent();
  const prev = stu?.submaterialProgress[subId];
  if (prev && prev.attempts >= AppState.settings.maxPracticeAttempts) {
    SoundFX.play('wrong');
    showToast(`Batas maksimal percobaan (${AppState.settings.maxPracticeAttempts}x) telah tercapai.`, 'red');
    return;
  }

  SoundFX.play('click');
  const qs = buildConstructiveTenQuestions(subId);
  const initialAnswers = {};
  qs.forEach((q, i) => {
    if (q.type === 'dragdrop') initialAnswers[i] = [...q.items];
    else if (q.type === 'mcma') initialAnswers[i] = [];
    else if (q.type === 'matching') initialAnswers[i] = {};
    else initialAnswers[i] = '';
  });

  AppState.quizState = {
    mode: 'practice',
    subId,
    questions: qs,
    currentIdx: 0,
    answers: initialAnswers,
    checkedPerQuestion: {},
    matchLeftSelected: null,
    submitted: false
  };
  AppState.lessonStep = 'quiz';
  render();
}

function checkSinglePracticeAnswer(qIdx) {
  const qz = AppState.quizState;
  const stu = getLoggedInStudent();
  if (!qz || qz.mode !== 'practice' || qz.checkedPerQuestion[qIdx]) return;

  const q = qz.questions[qIdx];
  const ok = isQuestionCorrect(q, qz.answers[qIdx]);
  qz.checkedPerQuestion[qIdx] = { checked: true, correct: ok };

  if (ok) {
    SoundFX.play('correct');
    awardUniquePoints(stu, `q-ok-${q.id}`, 10, 'Jawaban Benar!');
  } else {
    SoundFX.play('wrong');
  }
  render();
}

function toggleMcmaOption(qIdx, opt) {
  const arr = AppState.quizState.answers[qIdx] || [];
  const pos = arr.indexOf(opt);
  if (pos >= 0) arr.splice(pos, 1);
  else arr.push(opt);
  AppState.quizState.answers[qIdx] = arr;
  render();
}

function moveDragItem(qIdx, itemIdx, dir) {
  const arr = [...(AppState.quizState.answers[qIdx] || [])];
  const target = itemIdx + dir;
  if (target < 0 || target >= arr.length) return;
  [arr[itemIdx], arr[target]] = [arr[target], arr[itemIdx]];
  AppState.quizState.answers[qIdx] = arr;
  render();
}

function handleMatchPick(qIdx, side, val) {
  const qz = AppState.quizState;
  if (side === 'left') qz.matchLeftSelected = val;
  else if (side === 'right' && qz.matchLeftSelected) {
    qz.answers[qIdx][qz.matchLeftSelected] = val;
    qz.matchLeftSelected = null;
  }
  render();
}

function isQuestionCorrect(q, userAns) {
  if (q.type === 'mcq' || q.type === 'tf') {
    return String(userAns || '').trim() === String(q.answer).trim();
  }
  if (q.type === 'short') {
    const norm = s => String(s || '').trim().toLowerCase().replace(/\s+/g, '');
    return norm(userAns) === norm(q.answer);
  }
  if (q.type === 'mcma') {
    const u = Array.isArray(userAns) ? [...userAns].sort() : [];
    const a = Array.isArray(q.answer) ? [...q.answer].sort() : [];
    return u.length === a.length && u.every((v, i) => v === a[i]);
  }
  if (q.type === 'matching') {
    return q.pairs.every(p => userAns && userAns[p.left] === p.right);
  }
  if (q.type === 'dragdrop') {
    return Array.isArray(userAns) && q.answer.every((v, i) => userAns[i] === v);
  }
  return false;
}

function submitQuizEngine() {
  const qz = AppState.quizState;
  const stu = getLoggedInStudent();
  if (!qz || !stu) return;

  if (AppState.timerInterval) {
    clearInterval(AppState.timerInterval);
    AppState.timerInterval = null;
  }

  // Rumus Nilai Akademik: (Jumlah bobot jawaban benar / Total bobot seluruh soal) * 100
  let totalWeight = 0;
  let earnedWeight = 0;
  let correctCount = 0;
  qz.questions.forEach((q, idx) => {
    const w = Number(q.weight) || 10;
    totalWeight += w;
    if (isQuestionCorrect(q, qz.answers[idx])) {
      correctCount++;
      earnedWeight += w;
    }
  });
  const score = totalWeight ? Math.round((earnedWeight / totalWeight) * 100) : 0;
  qz.submitted = true;
  qz.score = score;
  qz.correctCount = correctCount;

  const todayStr = new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });

  if (qz.mode === 'practice') {
    const subObj = getAllSubmaterials().find(s => s.id === qz.subId);
    const prev = stu.submaterialProgress[qz.subId] || {
      completed: false,
      bestScore: 0,
      latestScore: 0,
      firstScore: score,
      attempts: 0,
      version: subObj?.version || 1
    };
    const actDone = stu.completedActivities.includes(qz.subId);
    const passed = score >= AppState.settings.passingScore && actDone;
    const nextAttemptNum = prev.attempts + 1;

    stu.submaterialProgress[qz.subId] = {
      completed: prev.completed || passed,
      bestScore: Math.max(prev.bestScore, score),
      latestScore: score,
      firstScore: prev.attempts === 0 ? score : prev.firstScore,
      attempts: nextAttemptNum,
      version: subObj?.version || 1,
      lastDate: todayStr
    };

    stu.scoreHistory.push({
      type: 'Latihan',
      subId: qz.subId,
      label: `L${subObj ? subObj.order : '?'}. ${subObj ? subObj.title : 'Latihan'} (Coba ${nextAttemptNum})`,
      score,
      attempt: nextAttemptNum,
      date: todayStr
    });

    if (passed) {
      SoundFX.play('correct');
      awardUniquePoints(stu, `sub-${qz.subId}`, 20, 'Submateri Selesai!');
      if (!stu.badges.includes('b-first')) stu.badges.push('b-first');
      if (score === 100) {
        awardUniquePoints(stu, `perf-${qz.subId}`, 30, 'Nilai Sempurna 100!');
        if (!stu.badges.includes('b-100')) stu.badges.push('b-100');
      }
      // Cek ketuntasan per Bab
      AppState.chapters.forEach((ch, cIdx) => {
        const chPub = ch.submaterials.filter(s => s.status === 'published');
        if (chPub.length && chPub.every(s => stu.submaterialProgress[s.id]?.completed)) {
          awardUniquePoints(stu, `bab-${ch.id}`, 50, `${ch.number} Tuntas!`);
          const bMap = ['b-bab1', 'b-bab2', 'b-bab3', 'b-bab4'];
          if (bMap[cIdx] && !stu.badges.includes(bMap[cIdx])) stu.badges.push(bMap[cIdx]);
        }
      });
      if (getProgressPercent(stu) === 100) {
        awardUniquePoints(stu, 'all-materials-100', 100, 'Seluruh Materi Tuntas!');
      }
    } else {
      SoundFX.play('wrong');
    }
    AppState.lessonStep = 'result';
  } else {
    // Asesmen Sumatif
    const attNum = stu.summativeAttempts.length + 1;
    stu.summativeAttempts.push({ score, attempt: attNum, date: todayStr });
    stu.scoreHistory.push({
      type: 'Sumatif',
      subId: 'summative',
      label: `Asesmen Sumatif (Coba ${attNum})`,
      score,
      attempt: attNum,
      date: todayStr
    });
    awardUniquePoints(stu, 'summative-done', 100, 'Asesmen Sumatif Selesai!');
    if (!stu.badges.includes('b-champion')) stu.badges.push('b-champion');
    SoundFX.play('levelup');
  }
  render();
}

function formatSeconds(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function startSummativeAssessment() {
  const stu = getLoggedInStudent();
  if (!stu) return;
  // Verifikasi penguncian di level logika/state (bukan sekadar tombol)
  if (getProgressPercent(stu) < 100) {
    SoundFX.play('wrong');
    showToast('Akses ditolak! Selesaikan 100% submateri terlebih dahulu.', 'red');
    return;
  }
  if (!AppState.summativeConfig.isOpen) {
    showToast('Periode Asesmen Sumatif sedang ditutup oleh guru.', 'yellow');
    return;
  }
  if (stu.summativeAttempts.length >= AppState.summativeConfig.maxAttempts) {
    showToast(`Kesempatan mengerjakan Asesmen Sumatif (${AppState.summativeConfig.maxAttempts}x) sudah habis.`, 'red');
    return;
  }

  SoundFX.play('click');
  let pool = [...AppState.questions];
  if (AppState.summativeConfig.shuffleQuestions) {
    pool.sort(() => Math.random() - 0.5);
  }
  const qs = pool.slice(0, AppState.summativeConfig.questionCount);
  const initialAnswers = {};
  qs.forEach((q, i) => {
    if (q.type === 'dragdrop') initialAnswers[i] = [...q.items];
    else if (q.type === 'mcma') initialAnswers[i] = [];
    else if (q.type === 'matching') initialAnswers[i] = {};
    else initialAnswers[i] = '';
  });

  AppState.quizState = {
    mode: 'summative',
    subId: 'summative',
    questions: qs,
    currentIdx: 0,
    answers: initialAnswers,
    secondsLeft: AppState.summativeConfig.durationMinutes * 60,
    submitted: false
  };

  if (AppState.timerInterval) clearInterval(AppState.timerInterval);
  AppState.timerInterval = setInterval(() => {
    if (!AppState.quizState || AppState.quizState.mode !== 'summative' || AppState.quizState.submitted) {
      clearInterval(AppState.timerInterval);
      return;
    }
    AppState.quizState.secondsLeft--;
    const badge = document.getElementById('sum-timer-badge');
    if (badge) badge.innerHTML = `<i class="fa-solid fa-clock mr-1"></i>${formatSeconds(Math.max(0, AppState.quizState.secondsLeft))}`;
    if (AppState.quizState.secondsLeft <= 0) {
      clearInterval(AppState.timerInterval);
      showToast('Waktu habis! Asesmen dikumpulkan otomatis.', 'yellow');
      submitQuizEngine();
    }
  }, 1000);

  render();
}

function changeStudentPassword() {
  const stu = getLoggedInStudent();
  if (!stu) return;
  const oldPass = document.getElementById('stu-old-pass')?.value.trim();
  const newPass = document.getElementById('stu-new-pass')?.value.trim();
  const confPass = document.getElementById('stu-conf-pass')?.value.trim();

  if (!Security.verifyPassword(oldPass, stu.passwordHash)) {
    SoundFX.play('wrong');
    showToast('Password lama tidak sesuai!', 'red');
    return;
  }
  if (!newPass || newPass.length < 4) {
    SoundFX.play('wrong');
    showToast('Password baru minimal 4 karakter.', 'yellow');
    return;
  }
  if (newPass !== confPass) {
    SoundFX.play('wrong');
    showToast('Konfirmasi password baru tidak cocok.', 'red');
    return;
  }

  stu.passwordHash = Security.hashPassword(newPass);
  SoundFX.play('correct');
  showToast('Password akun murid berhasil diperbarui!', 'green');
  render();
}

    showToast('Konfirmasi password baru tidak cocok.', 'red');

  AppState.teacherAccount.passwordHash = Security.hashPassword(newPass);

  SoundFX.play('correct');
  showToast('Password guru berhasil diperbarui (tersimpan dalam hash aman)!', 'green');
  render();
}

function renderInteractiveLineChartSVG(history, title = 'Grafik Perkembangan Nilai') {
  if (!history || !history.length) {
    return `<div class="p-8 text-center text-xs font-bold text-slate-400">Belum ada data riwayat nilai untuk ditampilkan pada grafik.</div>`;
  }

  const W = 720;
  const H = 260;
  const padL = 44;
  const padR = 24;
  const padT = 26;
  const padB = 46;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const kkm = AppState.settings.passingScore;
  const kkmY = padT + plotH - (kkm / 100) * plotH;

  const pts = history.map((h, i) => {
    const x = history.length === 1 ? padL + plotW / 2 : padL + (i / (history.length - 1)) * plotW;
    const y = padT + plotH - (Math.max(0, Math.min(100, h.score)) / 100) * plotH;
    return { ...h, x, y, idx: i + 1 };
  });

  const polylinePts = pts.map(p => `${p.x},${p.y}`).join(' ');

  return `
    <div class="space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="font-display font-black text-sm text-slate-900">${Security.sanitize(title)}</div>
        <div class="flex items-center gap-3 text-[11px] font-extrabold">
          <span class="flex items-center gap-1 text-blue-700"><span class="w-2.5 h-2.5 rounded-full bg-blue-600 inline-block"></span> Latihan</span>
          <span class="flex items-center gap-1 text-purple-700"><span class="w-2.5 h-2.5 rounded-full bg-purple-600 inline-block"></span> Sumatif</span>
          <span class="flex items-center gap-1 text-emerald-700"><span class="w-4 border-t-2 border-dashed border-emerald-500 inline-block"></span> KKM (${kkm})</span>
        </div>
      </div>

      <div class="relative w-full overflow-x-auto">
        <svg viewBox="0 0 ${W} ${H}" class="w-full min-w-[460px] h-auto select-none">
          ${[0, 25, 50, 75, 100].map(val => {
            const gy = padT + plotH - (val / 100) * plotH;
            return `
              <line x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}" stroke="#E2E8F0" stroke-width="1" />
              <text x="${padL - 8}" y="${gy + 4}" text-anchor="end" fill="#64748B" font-size="10" font-weight="700">${val}</text>
            `;
          }).join('')}

          <line x1="${padL}" y1="${kkmY}" x2="${W - padR}" y2="${kkmY}" stroke="#10B981" stroke-width="1.5" stroke-dasharray="5,4" />

          ${pts.length > 1 ? `<polyline fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${polylinePts}" />` : ''}

          ${pts.map(p => {
            const dotColor = p.type === 'Sumatif' ? '#9333EA' : '#2563EB';
            return `
              <g class="cursor-pointer">
                <title>${Security.sanitize(p.type)} • ${Security.sanitize(p.label)} | Nilai: ${p.score} | Tanggal: ${Security.sanitize(p.date)}</title>
                <circle cx="${p.x}" cy="${p.y}" r="6" fill="${dotColor}" stroke="#FFFFFF" stroke-width="2" />
                <text x="${p.x}" y="${p.y - 10}" text-anchor="middle" fill="#0F172A" font-size="10" font-weight="800">${p.score}</text>
                <text x="${p.x}" y="${H - 16}" text-anchor="middle" fill="#475569" font-size="9" font-weight="700">#${p.idx} (${p.type === 'Sumatif' ? 'Sum' : 'Lat'})</text>
              </g>
            `;
          }).join('')}
        </svg>
      </div>
    </div>
  `;
}

function applyResetStudentPass(stuId) {
  const stu = AppState.studentsList.find(s => s.id === stuId);
  const newPass = document.getElementById('rsp-pass')?.value.trim();
  if (!stu || !newPass || newPass.length < 4) return;
  stu.passwordHash = Security.hashPassword(newPass);
  logAudit(`Mereset kata sandi murid ${stu.name}`);
  closeModal();
  showToast(`Kata sandi ${stu.name} berhasil direset!`, 'green');
  render();
}

                  <div class="flex items-center gap-2">
                    <span class="font-black text-blue-700">L${sub.order}</span>
                    <span class="font-extrabold text-sm text-slate-900">${Security.sanitize(sub.title)}</span>
                    <span class="px-2 py-0.5 rounded text-[10px] font-black ${sub.status === 'published' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                      ${sub.status === 'published' ? 'Terbit' : 'Draf'} • v${sub.version || 1}
                    </span>
                  </div>
                  <p class="text-slate-500 mt-0.5">${Security.sanitize(sub.goal)}</p>
                </div>
                <div class="flex items-center gap-1.5">
                  <button onclick="moveSubmaterialOrder('${chap.id}', ${sIdx}, -1)" class="p-2 rounded-lg bg-white border border-slate-300" title="Naikkan Urutan"><i class="fa-solid fa-arrow-up"></i></button>
                  <button onclick="moveSubmaterialOrder('${chap.id}', ${sIdx}, 1)" class="p-2 rounded-lg bg-white border border-slate-300" title="Turunkan Urutan"><i class="fa-solid fa-arrow-down"></i></button>
                  <button onclick="toggleSubmaterialPublish('${sub.id}')" class="px-3 py-1.5 rounded-lg bg-indigo-50 text-indigo-700 font-black">${sub.status === 'published' ? 'Sembunyikan' : 'Publikasikan'}</button>
                  <button onclick="openMaterialEditorModal('${sub.id}')" class="px-3 py-1.5 rounded-lg bg-blue-50 text-blue-700 font-black">Edit</button>
                  <button onclick="confirmDeleteSubmaterial('${sub.id}')" class="px-3 py-1.5 rounded-lg bg-rose-50 text-rose-700 font-black">Hapus</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function moveSubmaterialOrder(chapId, idx, dir) {
  const ch = AppState.chapters.find(c => c.id === chapId);
  if (!ch) return;
  const target = idx + dir;
  if (target < 0 || target >= ch.submaterials.length) return;
  [ch.submaterials[idx], ch.submaterials[target]] = [ch.submaterials[target], ch.submaterials[idx]];
  let seq = 1;
  AppState.chapters.forEach(c => c.submaterials.forEach(s => { s.order = seq++; }));
  render();
}

function toggleSubmaterialPublish(subId) {
  const sub = getAllSubmaterials().find(s => s.id === subId);
  if (!sub) return;
  sub.status = sub.status === 'published' ? 'draft' : 'published';
  logAudit(`Mengubah status materi "${sub.title}" menjadi ${sub.status}`);
  render();
}

function saveMaterialForm(editId) {
  const chapId = document.getElementById('me-chap').value;
  const status = document.getElementById('me-status').value;
  const title = document.getElementById('me-title').value.trim();
  const goal = document.getElementById('me-goal').value.trim();
  const contextHook = document.getElementById('me-hook').value.trim();
  const explanation = document.getElementById('me-exp').value.trim();
  const formula = document.getElementById('me-formula').value.trim();
  const interactiveType = document.getElementById('me-lab').value;
  const imageUrl = document.getElementById('me-img').value.trim();
  const videoUrl = document.getElementById('me-vid').value.trim();

  if (editId) {
    const sub = getAllSubmaterials().find(s => s.id === editId);
    if (sub) {
      sub.version = (sub.version || 1) + 1;
      sub.status = status;
      sub.title = title;
      sub.goal = goal;
      sub.contextHook = contextHook;
      sub.explanation = explanation;
      sub.formula = formula;
      sub.interactiveType = interactiveType;
      sub.imageUrl = imageUrl;
      sub.videoUrl = videoUrl;
      logAudit(`Memperbarui materi "${title}" ke versi ${sub.version}`);
    }
  } else {
    const ch = AppState.chapters.find(c => c.id === chapId);
    if (ch) {
      const nextOrder = getAllSubmaterials().length + 1;
      ch.submaterials.push({
        id: 'm-custom-' + Date.now(),
        chapterId: chapId,
        order: nextOrder,
        version: 1,
        status,
        title,
        goal,
        indicators: {
          support: 'Mengidentifikasi konsep dasar pada ' + title,
          core: goal,
          enrichment: 'Menerapkan ' + title + ' pada masalah kontekstual'
        },
        contextHook,
        explanation,
        formula,
        imageUrl,
        videoUrl,
        example: {
          question: 'Contoh penerapan ' + title,
          steps: ['Identifikasi bilangan yang diketahui.', 'Terapkan aturan sesuai rumus kunci.'],
          answer: 'Sesuai perhitungan konsep di atas.'
        },
        interactiveType,
        summary: goal
      });
      logAudit(`Menambahkan submateri baru "${title}" (${status})`);
    }
  }
  closeModal();
  showToast('Materi berhasil disimpan!', 'green');
  render();
}

            ${subs.map(s => `<option value="${s.id}" ${AppState.teacherFilterSubId === s.id ? 'selected' : ''}>L${s.order}. ${Security.sanitize(s.title)}</option>`).join('')}
          </select>
          <button onclick="exportQuestionBankJSON()" class="px-4 py-2.5 rounded-xl bg-slate-800 text-white font-black">Ekspor JSON</button>
          <button onclick="openQuestionEditorModal()" class="px-4 py-2.5 rounded-xl bg-emerald-600 text-white font-black">+ Tambah Soal</button>
        </div>
      </div>

      <div class="space-y-3">
        ${list.map((q, idx) => `
          <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap items-start justify-between gap-4 text-xs">
            <div class="space-y-1 max-w-3xl">
              <div class="flex flex-wrap items-center gap-2">
                <span class="px-2 py-0.5 rounded bg-blue-100 text-blue-800 font-black">#${idx + 1} • ${q.type.toUpperCase()}</span>
                <span class="px-2 py-0.5 rounded bg-purple-100 text-purple-800 font-black">${q.cogLevel || 'C3'} • ${q.difficulty || 'Sedang'}</span>
                <span class="text-slate-400 font-bold">Bobot: ${q.weight || 10}</span>
              </div>
              <p class="font-extrabold text-sm text-slate-900">${Security.sanitize(q.question)}</p>
              <p class="text-emerald-700 font-bold">Kunci: ${Security.sanitize(Array.isArray(q.answer) ? q.answer.join(', ') : String(q.answer || 'Pasangan'))}</p>
            </div>
            <div class="flex gap-1.5">
              <button onclick="duplicateQuestionItem('${q.id}')" class="px-3 py-1.5 rounded-lg bg-slate-100 font-black">Duplikasi</button>
              <button onclick="openQuestionEditorModal('${q.id}')" class="px-3 py-1.5 rounded-lg bg-blue-50 text-blue-700 font-black">Edit</button>
              <button onclick="deleteQuestionItem('${q.id}')" class="px-3 py-1.5 rounded-lg bg-rose-50 text-rose-700 font-black">Hapus</button>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function openQuestionEditorModal(qId = null) {
  const existing = qId ? AppState.questions.find(q => q.id === qId) : null;
  const subs = getAllSubmaterials();
  openModal(`
    <form onsubmit="event.preventDefault(); saveQuestionForm('${qId || ''}');" class="space-y-3 text-xs">
      <h2 class="text-lg font-display font-black">${existing ? 'Edit Soal' : 'Tambah Soal Baru ke Bank Soal'}</h2>
      <div class="grid sm:grid-cols-3 gap-2">
        <div>
          <label class="font-extrabold block mb-1">Submateri</label>
          <select id="qe-sub" class="w-full p-2.5 rounded-xl border border-slate-300 font-bold">
            ${subs.map(s => `<option value="${s.id}" ${existing?.submaterialId === s.id ? 'selected' : ''}>L${s.order}. ${Security.sanitize(s.title)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="font-extrabold block mb-1">Level Kognitif</label>
          <select id="qe-cog" class="w-full p-2.5 rounded-xl border border-slate-300 font-bold">
            ${['C1', 'C2', 'C3', 'C4', 'C5', 'C6'].map(c => `<option value="${c}" ${existing?.cogLevel === c ? 'selected' : ''}>${c}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="font-extrabold block mb-1">Tipe Soal</label>
          <select id="qe-type" class="w-full p-2.5 rounded-xl border border-slate-300 font-bold">
            <option value="mcq" ${existing?.type === 'mcq' ? 'selected' : ''}>Pilihan Ganda</option>
            <option value="tf" ${existing?.type === 'tf' ? 'selected' : ''}>Benar / Salah</option>
            <option value="short" ${existing?.type === 'short' ? 'selected' : ''}>Isian Singkat</option>
          </select>
        </div>
      </div>
      <div>
        <label class="font-extrabold block mb-1">Indikator Soal</label>
        <input id="qe-ind" required value="${existing ? Security.sanitize(existing.indicator || '') : 'Menyelesaikan operasi bilangan rasional'}" class="w-full p-2.5 rounded-xl border border-slate-300 font-bold" />
      </div>
      <div>
        <label class="font-extrabold block mb-1">Pertanyaan</label>
        <textarea id="qe-q" rows="2" required class="w-full p-2.5 rounded-xl border border-slate-300 font-bold">${existing ? Security.sanitize(existing.question) : ''}</textarea>
      </div>
      <div>
        <label class="font-extrabold block mb-1">Opsi Pilihan Ganda (Pisahkan dengan tanda | )</label>
        <input id="qe-opts" value="${existing?.options ? Security.sanitize(existing.options.join(' | ')) : 'Opsi A | Opsi B | Opsi C | Opsi D'}" class="w-full p-2.5 rounded-xl border border-slate-300 font-bold" />
      </div>
      <div class="grid sm:grid-cols-2 gap-2">
        <div>
          <label class="font-extrabold block mb-1">Kunci Jawaban</label>
          <input id="qe-ans" required value="${existing ? Security.sanitize(String(existing.answer)) : ''}" class="w-full p-2.5 rounded-xl border border-slate-300 font-bold" />
        </div>
        <div>
          <label class="font-extrabold block mb-1">Bobot Nilai</label>
          <input id="qe-weight" type="number" min="1" max="100" value="${existing?.weight || 10}" class="w-full p-2.5 rounded-xl border border-slate-300 font-bold" />
        </div>
      </div>
      <div>
        <label class="font-extrabold block mb-1">Pembahasan</label>
        <textarea id="qe-exp" rows="2" required class="w-full p-2.5 rounded-xl border border-slate-300 font-bold">${existing ? Security.sanitize(existing.explanation) : ''}</textarea>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 font-bold">Batal</button>
        <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-600 text-white font-black">Simpan Soal</button>
      </div>
    </form>
  `);
}

function saveQuestionForm(editId) {
  const submaterialId = document.getElementById('qe-sub').value;
  const cogLevel = document.getElementById('qe-cog').value;
  const type = document.getElementById('qe-type').value;
  const indicator = document.getElementById('qe-ind').value.trim();
  const question = document.getElementById('qe-q').value.trim();
  const rawOpts = document.getElementById('qe-opts').value.split('|').map(s => s.trim()).filter(Boolean);
  const answer = document.getElementById('qe-ans').value.trim();
  const weight = Number(document.getElementById('qe-weight').value) || 10;
  const explanation = document.getElementById('qe-exp').value.trim();
  const options = type === 'tf' ? ['Benar', 'Salah'] : rawOpts;

  if (editId) {
    const q = AppState.questions.find(x => x.id === editId);
    if (q) Object.assign(q, { submaterialId, cogLevel, type, indicator, question, options, answer, weight, explanation });
    logAudit(`Mengedit soal ${editId}`);
  } else {
    AppState.questions.unshift({
      id: 'q-' + Date.now(),
      submaterialId,
      indicator,
      cogLevel,
      difficulty: 'Sedang',
      weight,
      type,
      question,
      options,
      answer,
      explanation
    });
    logAudit(`Menambah soal baru pada ${submaterialId}`);
  }
  closeModal();
  showToast('Bank soal diperbarui!', 'green');
  render();
}

function duplicateQuestionItem(qId) {
  const orig = AppState.questions.find(q => q.id === qId);
  if (!orig) return;
  const copy = JSON.parse(JSON.stringify(orig));
  copy.id = 'q-dup-' + Date.now();
  copy.question = '[Salinan] ' + copy.question;
  AppState.questions.unshift(copy);
  logAudit(`Menduplikasi soal ${qId}`);
  showToast('Soal berhasil diduplikasi.', 'blue');
  render();
}

function deleteQuestionItem(qId) {
  AppState.questions = AppState.questions.filter(q => q.id !== qId);
  logAudit(`Menghapus soal ${qId}`);
  render();
}

function exportQuestionBankJSON() {
  const blob = new Blob([JSON.stringify(AppState.questions, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bank_soal_pecahan_quest.json';
  a.click();
  showToast('Bank soal JSON berhasil diekspor!', 'green');
}

function renderTeacherSummativeCfgTab() {
  const cfg = AppState.summativeConfig;
  return `
    <div class="max-w-2xl space-y-6">
      <div>
        <h1 class="text-2xl font-display font-black text-slate-900">Pengaturan Asesmen Sumatif</h1>
        <p class="text-xs text-slate-500">Asesmen hanya dapat dibuka murid yang telah menuntaskan 100% submateri wajib.</p>
      </div>
      <form onsubmit="event.preventDefault(); saveSummativeConfig();" class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4 text-xs">
        <label class="flex items-center justify-between font-extrabold p-3 rounded-2xl bg-slate-50 border border-slate-200">
          <span>Status Periode Asesmen Sumatif (Buka / Tutup)</span>
          <input id="sc-open" type="checkbox" ${cfg.isOpen ? 'checked' : ''} class="w-4 h-4" />
        </label>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="font-extrabold block mb-1">Jumlah Soal Sumatif</label>
            <input id="sc-count" type="number" min="5" max="${AppState.questions.length}" value="${cfg.questionCount}" class="w-full p-2.5 rounded-xl border border-slate-300 font-bold" />
          </div>
          <div>
            <label class="font-extrabold block mb-1">Durasi Pengerjaan (Menit)</label>
            <input id="sc-dur" type="number" min="5" max="120" value="${cfg.durationMinutes}" class="w-full p-2.5 rounded-xl border border-slate-300 font-bold" />
          </div>
          <div>
            <label class="font-extrabold block mb-1">Nilai Ketuntasan (KKM)</label>
            <input id="sc-kkm" type="number" min="50" max="100" value="${cfg.passingScore}" class="w-full p-2.5 rounded-xl border border-slate-300 font-bold" />
          </div>
          <div>
            <label class="font-extrabold block mb-1">Kesempatan Pengerjaan</label>
            <input id="sc-att" type="number" min="1" max="5" value="${cfg.maxAttempts}" class="w-full p-2.5 rounded-xl border border-slate-300 font-bold" />
          </div>
        </div>
        <label class="flex items-center justify-between font-extrabold">
          <span>Acak Urutan Soal Sumatif</span>
          <input id="sc-shuf" type="checkbox" ${cfg.shuffleQuestions ? 'checked' : ''} class="w-4 h-4" />
        </label>
        <label class="flex items-center justify-between font-extrabold">
          <span>Tampilkan Pembahasan Setelah Dikumpulkan</span>
          <input id="sc-fb" type="checkbox" ${cfg.showFeedbackAfter ? 'checked' : ''} class="w-4 h-4" />
        </label>
        <button type="submit" class="px-6 py-3 rounded-xl bg-emerald-600 text-white font-black shadow">Simpan Pengaturan Sumatif</button>
      </form>
    </div>
  `;
}

function saveSummativeConfig() {
  AppState.summativeConfig = {
    isOpen: document.getElementById('sc-open').checked,
    questionCount: Number(document.getElementById('sc-count').value) || 10,
    durationMinutes: Number(document.getElementById('sc-dur').value) || 25,
    passingScore: Number(document.getElementById('sc-kkm').value) || 70,
    maxAttempts: Number(document.getElementById('sc-att').value) || 2,
    shuffleQuestions: document.getElementById('sc-shuf').checked,
    showFeedbackAfter: document.getElementById('sc-fb').checked
  };
  logAudit('Memperbarui pengaturan Asesmen Sumatif');
  showToast('Pengaturan Asesmen Sumatif disimpan!', 'green');
  render();
}

function renderTeacherReportsTab() {
  const pubSubs = getPublishedSubmaterials();
  const subStats = pubSubs.map(sub => {
    const scores = AppState.studentsList
      .map(s => getEffectivePracticeScore(s.submaterialProgress[sub.id]))
      .filter(v => typeof v === 'number');
    const avg = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : 0;
    return { title: sub.title, avg, count: scores.length };
  }).sort((a, b) => a.avg - b.avg);

  return `
    <div class="space-y-6">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-display font-black text-slate-900">Laporan Hasil Belajar & Log Audit</h1>
          <p class="text-xs text-slate-500">Analisis ketuntasan materi dan catatan perubahan sistem.</p>
        </div>
        <div class="flex gap-2">
          <button onclick="exportStudentsCSV()" class="px-4 py-2.5 rounded-xl bg-emerald-600 text-white font-black text-xs">Unduh CSV / Excel</button>
          <button onclick="window.print()" class="px-4 py-2.5 rounded-xl bg-slate-900 text-white font-black text-xs">Cetak / Simpan PDF</button>
        </div>
      </div>

      <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-3 text-xs">
        <h2 class="font-display font-black text-base text-slate-900">Analisis Rata-Rata Skor Per Submateri (Diurutkan dari Tersulit)</h2>
        ${subStats.map(st => `
          <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-200">
            <span class="font-extrabold text-slate-800">${Security.sanitize(st.title)}</span>
            <span class="font-black text-blue-700">Rata-rata: ${st.avg} (${st.count} murid)</span>
          </div>
        `).join('')}
      </div>

      <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-3 text-xs">
        <h2 class="font-display font-black text-base text-slate-900">Catatan Audit Perubahan Sistem</h2>
        <div class="divide-y divide-slate-100">
          ${AppState.auditLogs.slice(0, 10).map(l => `
            <div class="py-2 flex items-center justify-between">
              <span class="font-bold text-slate-800">${Security.sanitize(l.action)}</span>
              <span class="text-slate-400">${Security.sanitize(l.time)}</span>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function exportStudentsCSV() {
  const headers = ['No', 'Nama Murid', 'NIS', 'Kelas', 'Progres (%)', 'Rata-rata Latihan', 'Nilai Sumatif', 'Total Poin'];
  const rows = AppState.studentsList.map((s, idx) => {
    const cls = AppState.classes.find(c => c.id === s.classId);
    const sumVal = getLatestSummativeScore(s);
    return [
      idx + 1,
      `"${s.name}"`,
      s.nis,
      `"${cls ? cls.name : '-'}"`,
      getProgressPercent(s),
      getAveragePracticeScore(s),
      sumVal !== null ? sumVal : '-',
      s.points
    ].join(',');
  });
  const csv = [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'laporan_hasil_belajar_pecahan_quest.csv';
  a.click();
  showToast('Laporan CSV/Excel berhasil diunduh!', 'green');
}

function saveTeacherSettings() {
  AppState.settings.passingScore = Number(document.getElementById('ts-kkm').value) || 68;
  AppState.settings.maxPracticeAttempts = Number(document.getElementById('ts-att').value) || 5;
  AppState.settings.scoreDisplayPolicy = document.getElementById('ts-pol').value;
  logAudit(`Mengubah pengaturan KKM=${AppState.settings.passingScore}, kebijakan=${AppState.settings.scoreDisplayPolicy}`);
  showToast('Pengaturan pembelajaran berhasil disimpan!', 'green');
  render();
}

// ----------------------------------------------------------------------------
// 12. RENDER UTAMA & INISIALISASI HALAMAN
// ----------------------------------------------------------------------------
function render() {
  document.body.classList.toggle('reduced-motion', Boolean(AppState.settings.reducedMotion));
  const root = document.getElementById('app');
  if (!root) return;

  if (AppState.currentPage === 'teacher-dash') {
    if (!isTeacherAuthorized()) {
      AppState.currentPage = 'landing';
      root.innerHTML = renderLandingPage();
      return;
    }
    root.innerHTML = renderTeacherDashboard();
  } else if (AppState.currentPage === 'student-dash') {
    if (!getLoggedInStudent()) {
      AppState.currentPage = 'landing';
      root.innerHTML = renderLandingPage();
      return;
    }
    root.innerHTML = renderStudentDashboard();
  } else {
    root.innerHTML = renderLandingPage();
  }
}

window.onload = function () {
  render();
};
</script>
